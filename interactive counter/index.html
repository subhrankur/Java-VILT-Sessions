<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Counter</title>
  <link rel="stylesheet" href="style.css">
  <style>
   
  </style>
</head>
<body>

  <main class="counter-card">
    <span id="counter" class="counter-value">0</span>
    <div class="controls">
      <button id="decrement-btn" class="btn" aria-label="Decrease counter">-</button>
      <button id="increment-btn" class="btn" aria-label="Increase counter">+</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
